services:
  - type: web
    name: legalease-api
    runtime: python
    buildCommand: pip install -r legalEaseAPI/requirements.txt
    startCommand: uvicorn legalEaseAPI.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: legalease-frontend
    runtime: python
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: API_URL
        value: https://legalease-api.onrender.com
